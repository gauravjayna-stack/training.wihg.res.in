# Nginx reverse proxy for the WIHG Internship & Dissertation Management System.
# Place at /etc/nginx/sites-available/wihg.conf and symlink into sites-enabled.
# Replace wihg.example.org with your actual domain, then run:
#   sudo certbot --nginx -d wihg.example.org
# (see DEPLOYMENT_LINUX.md for the full Certbot walkthrough)

server {
    listen 80;
    server_name wihg.example.org;

    # Serve the built React SPA (output of `npm run build` in /client)
    root /var/www/wihg/client-dist;
    index index.html;

    client_max_body_size 10M; # allow receipt/report/PDF uploads up to ~8MB + overhead

    # API requests -> Node/Express (proxied via PM2 on port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public QR-verification shortlink -> Node/Express
    location /verify/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded receipts/reports/certificates -> Node/Express static file serving
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # React Router client-side routing fallback
    location / {
        try_files $uri /index.html;
    }

    # Basic hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# After running certbot, it will add a matching `server { listen 443 ssl; ... }`
# block automatically and redirect port 80 to 443.