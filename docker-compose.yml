version: "3.9"

# This compose file runs the API against PostgreSQL for production-style deployments.
# Before using it, switch prisma/schema.prisma's datasource provider to "postgresql"
# (it defaults to "sqlite" for zero-config local development) — see DEPLOYMENT_LINUX.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wihg_db
      POSTGRES_USER: wihg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - wihg_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wihg_user -d wihg_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wihg_user:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/wihg_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_long_random_string}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - wihg_uploads:/app/uploads
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  wihg_pg_data:
  wihg_uploads:
